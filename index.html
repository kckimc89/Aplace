<script>
/* Built-in PWA updater: no service worker; preserves origin and browser data. */
(function(){
 const btn=document.getElementById('inappUpdate');if(!btn)return;
 let busy=false;
 btn.addEventListener('click',async function(){
  if(busy)return;
  if(!navigator.onLine){alert('현재 인터넷 연결이 없습니다. 연결 후 다시 확인해 주세요.');return;}
  busy=true;const old=btn.textContent;btn.disabled=true;btn.textContent='🔎 최신 버전 확인 중…';
  try{
   const base=new URL('./',location.href);
   const remote=new URL('index.html',base);remote.searchParams.set('_check',Date.now());
   const res=await fetch(remote.toString(),{cache:'no-store',credentials:'same-origin'});
   if(!res.ok)throw Error('서버 응답 '+res.status);
   const html=await res.text();
   const version=(html.match(/<title[^>]*>[^<]*Stage\s+(2\.3\.[0-9.]+)/i)||[])[1];
   if(!version)throw Error('새 버전 번호를 확인할 수 없습니다.');
   const current=(document.title.match(/Stage\s+(2\.3\.[0-9.]+)/i)||[])[1]||'알 수 없음';
   if(version===current){alert('현재 Stage '+current+'입니다. 서버에서 확인한 최신 버전과 같습니다.');return;}
   const ok=confirm('서버 최신 버전: Stage '+version+'\n현재 버전: Stage '+current+'\n\n자동보강이나 사진 저장이 진행 중이라면 먼저 완료 또는 중지하고 백업을 보관하세요.\n\n앱을 종료하지 않고 새 버전을 불러올까요?');
   if(!ok)return;
   const target=new URL('./',location.href);target.searchParams.set('v',version.replace(/\./g,''));target.searchParams.set('update',String(Date.now()));
   location.replace(target.toString());
  }catch(e){alert('버전 확인에 실패했습니다. 인터넷 연결과 GitHub 배포 상태를 확인해 주세요.\n'+(e.message||e));}
  finally{busy=false;btn.disabled=false;btn.textContent=old;}
 });
})();
</script>
